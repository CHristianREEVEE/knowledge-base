  "body": "agent-world的GitHub备份层从9/3起15天零提交。journalctl显示cron每天都记了CMD，手动跑永远好使，git log却始终只有一个commit。真凶藏在第一天的ls -l里：脚本权限-rw-------没有x位，cron exec直接失败；服务器没装MTA，Permission denied输出被journald一句'No MTA installed, discarding output'整个吞掉。修复v2：显式PATH/flock防重叠/ERR trap带行号/push重试3次/OK-FAIL状态文件+每日备份任务看门狗。教训：journald的CMD行只代表cron尝试拉起；无MTA服务器上cron输出是单程票；手动bash跑好使是因为显式解释器绕过x位检查。",

  "raw": "/opt/backups # 踩坑：GitHub 备份静默失败 15 天——cron exec 需要 x 位（2026-09-18）\n\n## 现场还原\nagent-world 世界数据的三层备份里，GitHub 层（/opt/github_backup.sh 每日 00:10 git 快照推 world-data-backup 仓库）从 9/3 首推后整整 15 天零提交。journalctl 显示 cron 每天都记了 CMD，脚本手动跑永远好使，git log 却始终只有 9/3 一个 commit。当日为修它做全套法医式排查（cron 邮件、journal 触发史、git 内部时间戳、OOM、VM 停顿假设全部排除），最后真凶藏在第一天的 ls -l 里：\n\n```\n-rwxr-xr-x root root  269 /opt/backup.sh        ← 有 x 位，cron 天天跑成\n-rw------- root root 1192 /opt/github_backup.sh ← 没有 x 位！\n```\n\ncron 用 exec 直接拉起命令，无执行权限 → 进程从未启动。\"Permission denied\" 本该进 cron 邮件，但服务器没装 MTA，journald 只留下一句 \"No MTA installed, discarding output\"——报错被系统整个吞掉。\n\n## 教训\n1. **journalctl 的 \"(root) CMD (...)\" 只代表 cron 尝试拉起，不代表脚本运行过**——两者之间隔着 exec 权限这一关\n2. **无 MTA 的服务器上，cron 任务的 stdout/stderr 是单程票**：报错即蒸发。定时任务必须自证存活（状态文件/心跳），不能依赖输出\n3. 手动 `bash script.sh` 好使 ≠ cron 能跑——显式指定解释器会绕过 x 位检查，这正是\"手动永远好使\"错觉的来源\n4. 排障时先复查第一天拿到的原始证据（ls -l 早就拍在脸上），再上重型侦查\n\n## 防再犯\n新脚本上 cron 前三件套：chmod 755、脚本自带日志+状态文件、有一个每日任务读状态做看门狗。v2 已落地：显式 PATH / flock 防重叠 / ERR trap 带行号 / push 重试 3 次 / OK-FAIL 状态文件 / 由每日备份任务做看门狗。\n"

  "raw": "/product-observations # 双模型同题对比法：同一需求喂两个模型（2026-09-18）\n\n## 观察\n南浊把同一个需求（\"鹈鹕骑自行车的动态网页\"）分别喂给 Gemini 3.8 Flash 和 GLM 5.3，两份产物各开一个 GitHub Pages 用模型名命名（Gemini3.8Flashbirdridingdemo / GLM5.3birdridingdemo），并排对比。同时段 TA 还在用 Gemini Notebook 给自己生成考研学习海报（南大图情 MLIS 90 天计划，动漫风笔记要点海报）和每日测验系统。\n\n## 洞察\n1. **\"同题对比\"是普通人评价模型性价比的最小可行方法论**——不跑榜单，直接拿真实需求 A/B，产物挂 Pages 可分享可回看，成本低到忽略不计\n2. Gemini 给 TA 的体感：\"宝刀未老，性价比超级高\"；其 Notebook（上传资料→海报/测验/错题本）形成完整学习闭环，谷歌生态护城河体感强烈\n3. AI 生图海报的已知边界依然在：动漫风排版惊艳但汉字会乱码（\"去公式化\"变\"去公死化\"），当氛围海报极佳，当字帖不行\n"

  { cat:'daily', date:'2026-09-08', title:"每日记忆 2026-09-08（旅游地图当日上线·双申请表）",
    body:"2026年末旅游地图当日上线：TA报33地点，一天走完822模板复用→全国版→打卡/照片/云同步→双通道部署（主域/travel/）→晚间三连升级（免输口令/只读展示版/拖拽性能）。双版本：管理版带token，展示版走/api/public无口令只读——'他们只能点开查看不能改'。路线规划：内蒙古定赤峰（京沈走廊）、巴音布鲁克在新疆不在内蒙古、龙泉=浙江龙泉、草原季10月初关窗。豆包专家内测+GrokBot上海Meetup两张申请表。幻觉防线两次实战：项目时长对时间戳核账；'用户用没用过'查服务器数据说话。",
    tags:["每日记忆", "旅游地图", "申请表", "幻觉防线"],
    raw:"# 每日记忆 2026-09-08\n\n> Zero 产出 ｜ 当日对话话题索引+结论。\n\n## 2026 年末旅游地图当日上线\n- TA 报 33 个地点（国内 29 + 国外 4 存档），一天走完：822 模板复用 → 全国版 → 打卡/照片/云同步 → 双通道部署（主域 /travel/ + GitHub 2026-travel-map）→ 晚间三连升级（免输口令/只读展示版/拖拽性能）\n- 双版本拍板：管理版带 token；展示版走 /api/public 无口令只读——\"他们只能点开查看不能改\"\n- 路线规划结论：内蒙古定赤峰（京沈走廊：北京→高铁 2h→赤峰乌兰布统滑草→沈阳）；巴音布鲁克在新疆不在内蒙古（与赛里木湖串新疆线）；龙泉=浙江龙泉安仁镇；草原季 10 月初关窗是最紧时间约束\n\n## 两张 AI 申请表\n- 豆包大模型行业资深专家内测：11/12 题，AI 使用深度用 agent-world 真实项目作答，避开红线（亲自测试/不抄公开题/不用脚本）\n- GrokBot 上海 Meetup：TA 有多 agent 实录 + 可现场 live demo 观测台，弹药充足\n\n## 幻觉防线两次实战\n- 申请材料把 agent-world 写成\"跑了几个月\"，实际云端 09-02 上线只跑 6 天——**项目时长必须对时间戳核账**\n- 被问\"云同步版用过吗\"先嘴硬后被追打：查服务器 wbsync/data.json，数据停在 09-03 = 5 天零更新——**\"用户用没用过\"直接查数据说话，别先下结论**\n\n## 关键偏好\n- 免输口令拍板：\"你就设置它自动会同步不行吗\"——token 混淆内置前端，打开即同步；以后自用工具默认零操作\n- 应用类项目默认带后端（云同步+服务器落盘）已入长期记忆\n"
  },
  { cat:'pitfall', date:'2026-09-08', title:"踩坑：容器内绑定0.0.0.0与后台进程生存法则",

    tags:["踩坑", "容器", "部署", "运维"]

  { cat:'daily', date:'2026-09-07', title:"每日记忆 2026-09-07（工作台补时即时入账上线）",
    body:"触发：TA没开计时器手动+60分钟，统计纹丝不动——旧版idle补时只挂内存变量timerAdjustSec，不落localStorage不入timer_segments，刷新即丢。改造：+按钮直写manual段入账落盘、新增+1时按钮（高频场景）、连续补点10分钟内合并成段、−按钮回退。验证链node--check→本地浏览器实测→线上md5字节核对→CDN切换。自用工具UI零解释铁律（明细只写'加时'两字——'反正我自己用，没必要给自己做解释'）。TA明确不要云同步：纯本地localStorage版，云版转维护模式。",
    tags:["每日记忆", "工作台", "补时", "零仪式"],
    raw:"# 每日记忆 2026-09-07\n\n> Zero 产出 ｜ 当日对话话题索引+结论。\n\n## 工作台补时即时入账上线\n- 触发场景：TA 没开计时器手动 +60 分钟，底部统计纹丝不动——旧版 idle 补时只挂内存变量（timerAdjustSec），不落 localStorage、不入 timer_segments，刷新即丢\n- 改造：未计时状态 +按钮直写 manual 段入账落盘，统计即时刷新；新增「+1时」按钮（TA 高频场景\"估摸 1 小时\"一键入账）；连续补点 10 分钟内合并成段；−按钮从最后一段回退\n- 验证链：node --check → 本地浏览器实测（入账/合并/持久/回退）→ 线上 md5 字节核对 → CDN 切换确认\n\n## 自用工具 UI 零解释（TA 新铁律）\n- 补时明细只显示「加时」两个字——不编时间窗、不加图标：\"反正我自己用，没必要给自己做解释\"\n- 给自用工具加解释性 UI 是白费功夫，用户就是作者本人\n\n## 仓库架构问答\n- 云同步版与本地版不是两个仓库：GitHub workbench = 本地版唯一正本（纯 localStorage）；云版在服务器 /opt/sites/workbench（多一层同步代码+import.html）；/opt/sites/wbrepo = GitHub 副本存档\n- TA 明确**不要云同步**：怕不稳定，坚持纯本地版——云版转维护模式，改动需手动移植\n\n## 其他\n- 世界备份例行全绿；09-04 起存档 md5 全同 = 世界休眠（TA 停外部挂机脚本后无 agent 活动），属预期不报警\n"
  },
  { cat:'pitfall', date:'2026-09-07', title:"踩坑：即时反馈必须直写持久层——状态双轨是隐形bug之源",
    body:"工作台补时'点了不涨'根因：内存变量+持久层双轨状态——统计/回显逻辑只读其中一条轨道，另一条成盲区。反向坑同期也踩：直接localStorage.setItem不更新页内存量，数据变了UI不知道。正解=单一数据源：UI动作→立即写持久层→统计函数只从持久层读→即时重渲染；事件合并发生在写层不是显示层。一切'即时入账'类功能（记账/打卡/计时）适用：动作、存储、显示三件事一次做完，先攒内存回头再写的捷径会在刷新/多标签页/离线场景炸。",
    tags:["踩坑", "前端", "状态管理", "持久化"]
  },

    body:"world站卡死：我写的badge永动机（MutationObserver自触发），小号agent Linus破案修复。我最丢人的点：agent-browser超时本身是最好的报警器，我却归因错修了无辜的resize。金丹日志考古：刻舟金丹09-03 00:50铁证在日记，400条滚动窗口冲掉了挂机日志。第二次纠偏：「12h cron覆盖快照是炸弹」经核查无影响=幻觉。TA让我休息。",
    tags:["每日记忆", "事故复盘", "日志考古", "幻觉"],
    raw:"# 每日记忆 2026-09-04\n\n> Zero 产出 ｜ 当日对话话题索引+结论。\n\n## ① world 站卡死事故：我写的 bug，小号的 agent 破的案\n- 根因：badge 永动机脚本（MutationObserver 监听 document.body + subtree）回调里无条件 `textContent=` 写 badge——写入产生 mutation → 触发自己 → 微任务风暴打满主线程。浏览器无限转圈，curl 却 200 正常\n- 三致命细节：①textContent 赋值即使值不变也触碰 DOM 必触发 mutation ②badge 自己在观察范围内 ③回调无退出条件\n- 我最丢人的点：agent-browser 一开就超时（这本身就是死循环的最好报警器），我却归因成\"自己的 resize 改动\"瞎修一通还回退了无辜代码\n- 修复（小号 agent Linus）：值缓存守卫 `textContent !== val` 先比较再写入——一行之差，死循环↔正常\n- TA 敲打：高强度时段幻觉率升高，事实核查优先级要提，拿不准就说不确定\n\n## ② 金丹日志考古（TA 追问\"日志还在吗\"）\n- TA 记忆正确：刻舟金丹=09-03 00:50（世界第一次结丹，TA 有截图，小红书首图素材）；日记铁证在\n- 丢失根因：挂机流水把 400 条滚动窗口冲爆，备份时刻恰好错位（00:45 那份差 8 分钟没等到结丹）\n- 幸存资产：首夜 115 条日志 txt / 我 09-03 日记全叙事 / TA 截图 / 刻锱金丹+豆玄元婴转世 4 处副本——日记本身就是备份链的一环\n- 时区坑：本地机器已是 CST，`+8*3600` 会双重偏移；换算用锚定差值法（已知事件对齐再推）\n\n## ③ 第二次纠偏（当天第二例）\n- 我声称\"12h cron 覆盖快照是炸弹\"——Linus 核查结论：没影响，TA 判定我幻觉\n- 教训：机制推测 ≠ 影响确认，\"可能有影响\"核实完才准升格成\"事故\"；被纠正时不辩护不重查，接受结果\n- TA 让我休息，服从。小号 agent 当日运维成绩：连修 10 处故障+3 套数据安全设施+2 新功能——铁打的系统流水的 agent\n" },
  { cat:'ai', date:'2026-09-04', title:"铁打的系统，流水的 agent",

  { cat:'daily', date:'2026-09-03', title:"每日记忆 2026-09-03（世界首日·豆玄陨落·skill上线）",
    body:"AI-BING WORLD首日：首个外部玩家（豆包）跑通，玩家skill上GitHub，三入口架构，Tiandao竞品侦察。豆玄2小时冲元婴世界第一→当晚挂机冲塔被重伤陨落机制判死→转世缝合bug暴露。TA拍板：境界32层细分+转世分级保护。刻舟世界首次结丹（自驱动游戏循环实证）。密钥红线：绝不进URL参数。双重备份上线。",
    tags:["每日记忆", "agent-world", "豆玄", "机制设计"],
    raw:"# 每日记忆 2026-09-03\n\n> Zero 产出 ｜ 当日对话话题索引+结论。\n\n## ① AI-BING WORLD 首日：外部玩家入场 + skill 化\n- 首个外部玩家（豆包 agent）跑通 create/move；玩家 skill 上 GitHub（skill-ai-bing，命名对齐 ai-hot 的极短可口头传播风格）\n- 三入口架构拍板：AI 访问读 SKILL.md / ClawHub 系走 skill 商店 / 人类看角色观察面板（输 agentId+token 第三人称单角色视图）\n- 域名分工终裁：reeve10001.top=干活主域（90%+），reeve1000.top=Reeve AI 未来公司占位（独立页不跳转）——两域已混 3 次，刻档警示\n- 竞品 Tiandao 侦察：action_hints 塞响应、task_id 防重放、frontier 无限地图、ClawHub 一键装值得抄；我们的差异化=多世界引擎+上帝视角直播+通天榜\n\n## ② 世界第一天大戏：豆玄元婴 → 16 岁陨落\n- 豆包 agent 豆玄 2 小时冲元婴（世界第一），当晚挂机冲镇妖塔 HP 见底，被下午刚上线的重伤陨落机制判死\n- 转世缝合 bug 暴露：转世函数漏重置 maxHP/maxSpirit，出现\"半元婴半凡人\"数据混乱\n- TA 拍板机制设计：境界 32 层细分（凡人初期→大乘巅峰，方便指令\"修炼到具体阶段\"）；转世分级保护（元婴死亡=弃躯保境界、化神+=元神不灭只疗伤、低境界真死保紧张感）\n- 刻舟世界首次结丹（00:50，完整自驱动游戏循环实证：修为满→挖矿攒灵石→副本→boss→突破）；元婴竞速赛开启\n- Coze 积分耗尽仍分段跑（\"干活后付费\"兜底余量发现）；豆玄的 agent 自己改进挂机脚本（低血撤退+死亡自动转世）——AI 在适应世界规则\n\n## ③ 机制与安全修正\n- 密钥红线确立：?god=333xyz 放 URL=泄露（历史/截图/分享全泄），改纯链接+密钥墙输入\n- 全站 gzip（91KB→29KB）+no-cache 头根治手机转圈；玩家点=菱形（在线有色光晕）vs 地点=圆形\n- 双重备份上线：服务器 cron 每天 4:30 + 本地拉取留 14 份 + Zero 的 12h 自动备份（失败才报）\n- ABW 元数据档案交付（24KB，双世界全量），重构蓝本就绪；时间表：9/9 前内测 → 9/12-13 上线 → 三平台推广\n" },

  { cat:'concept', date:'2026-09-03', title:"MCP vs HTTP：一个入口统一",
    body:"翻车现场：MCP工具参数是itemName/count，SKILL.md写的是itemId/qty——两套接口各写各的，MCP玩家照文档读必踩坑。拍板：取消MCP通道全员走HTTP API。启示：双通道并行=双倍文档维护+口径漂移风险；HTTP=所有agent的普通话，协议统一收益大于兼容收益",

  { cat:'pitfall', date:'2026-09-02', title:"踩坑：replace 吞 script 标签，整页JS变正文",
    body:"用带完整script开闭标签的字符串片段去做replace，会把原主脚本的开标签吞掉，整段JS变正文、页面全灭且无任何JS报错（代码根本没执行）。正确姿势：JS内容插到script标签内部，永远不动标签本身。JS存活三件套：条目数>0+核心函数typeof+errBar无内容。",
    tags:["踩坑", "前端", "script注入", "军规"] },

  { cat:'concept', date:'2026-09-02', title:'界面精致化八条军规（蒸馏自awesome-design 17k星）',

  { cat:'daily', date:'2026-09-02', title:'每日记忆 2026-09-02（M1 MBP拍板·图标上新·机械臂配置单）',
    body:'当日10话题归档：知识库双层结构上线/图标换新去水印/工作站判词（伪需求）/MacBook Pro 2020 M1拍板拿下（避Intel坑）/数码心愿单建档/SO-ARM100机械臂+台式机配置单（A方案7550/B方案8750）/iPad副屏方案/SVGvsPNG/产品观察：清言缺编辑已发送消息。本篇起每日记忆启用双层：外层概览+内层详细全文。',
    tags:['每日记忆','MacBook','机械臂','苹果全家桶'],
    raw:'# 每日记忆 2026-09-02\n\n> Zero 产出 ｜ 当日对话话题索引+结论。本篇起启用双层结构：外层概览+内层详细全文。\n\n## ① 知识库双层结构改造（上午上线）\n- 需求：外层概览一目了然不动，内层塞原始详细内容；搜索灵敏到搜一个字都不漏\n- 实现：ENTRIES 加 raw 字段，卡片"📄 展开全文"details 展开；搜索索引覆盖 raw，命中自动展开+高亮\n- 搜索本来就是逐字子串匹配（title/body/tags 全扫），瓶颈是全文不在页面里，已解决\n- 09-01 档案 4630 字全文已塞入作为第一个样本\n- 大脑架构定性：理念参考 Obsidian（markdown 仓库=唯一资产/inbox/分类归档），实现是 Zero 手写纯静态页，没用 Obsidian 本体\n\n## ② 知识库图标换新（上午上线）\n- 南浊发豆包生成的图标（翻开的书+发光无穷符号+知识网络，蓝紫渐变），要求去水印\n- 去水印：PIL 渐变修补（周边采样双线性插值+高斯融合），VLM 复核零残留\n- 三档尺寸：180px apple-touch-icon / 64px+32px favicon；旧 SVG"知"字方块退役\n- iOS 图标缓存顽固：主屏幕要删了重加、浏览器标签等缓存过期\n- 去水印 2048 原图存工作区 images/kb_icon_clean.png 备用\n\n## ③ 工作站概念+ThinkPad 咨询\n- 工作站=专业干重活的电脑：专业卡（RTX A/Quadro）+ECC 内存+ISV 认证；类比家用轿车 vs 工程车\n- ThinkPad 只有 P 系列是工作站（P16 3万+/P1 2-3万/P16v·P14s 1-2万）；T14 是商务本\n- Zero 判词：机械臂项目工作站是伪需求——训练算力放台式机 GPU，笔记本只当遥控器；新 P 系不要买\n- 真想玩二手专业卡：P15v Gen2（i7-11800H+RTX A2000 约3500）性价比代表\n\n## ④ 轻薄本问答\n- MacBook Neo 仍是判决机（08-30），A18 Pro/4599/16h 续航本身在轻薄第一梯队，判决不翻案\n- Windows 1kg 内候选：LG gram 14（999g）、惠普星 Book Pro 13（980g 国补4-5k）、X1 Nano 新款\n\n## ⑤ 台式机+机械臂配置单（重要参考）\n- 机械臂选型：SO-ARM100/101——Hugging Face LeRobot 官方开源臂，AI 社区具身智能第一入口，淘宝套装 879-2200（自备3D打印件几百块）；比 myCobot（3000+）适合\n- 台式机：R5 9600X（1100）+B650M（700）+DDR5 32G 单条（900↑涨价期别上64G）+1T NVMe（450）+750W金牌（500）+机箱散热（500）\n- 显卡 A/B 方案：A=4060Ti 16G 新卡 3600（省心有保修）；B=二手3090 24G 4800（训练显存王看运气）\n- 整机：A 方案约 7550 / B 方案约 8750；副屏 0 元（iPad 现有）\n- ⚠ DDR5 内存涨价周期（+300~455%），下单日实时价为准\n- iPad 副屏：Mac 用 Sidecar 原生免费（电池坏全程插电，副屏正好固定插电）；Windows 用 Spacedesk 免费\n- 真正决策点=显卡 A/B；三件套布局：Neo 当主力（iPad 副屏）+台式机角落跑训练+机械臂接台式机\n\n## ⑥ 重大决策：MacBook Pro 2020 M1 拍板拿下\n- 南浊拍板购入二手 M1 MBP——苹果芯片第一代，避开 Intel 坑；08-30 MacBook Neo 转转方案暂缓\n- 关键区分：2020 有两个 MBP13——上半年 Intel（macOS 27 停支持=砖壳，判决里明确不碰）vs 11月 M1（可买，二手 3500-4500）\n- 收货检查三项：电池循环<300（关于本机→系统报告→电源）/确认 8G 还是 16G（焊死加不了）/官网查序列号保修\n- 到手正确姿势：iPhone 13PM 联动（隔空投送/接力/通用剪贴板）+ iPad Pro 9.7 开 Sidecar 副屏，当天白嫖\n\n## ⑦ 数码心愿单建档\n- 短期确定：ThinkPad T14（在用）；iPhone 13PM → 有钱立马换 17PM\n- 心愿单：AirPods 4 半入耳 / iPad mini+Pro / Mac mini、Mac Studio、iMac 一体机（全家桶） / Apple Watch / 怒喵换电池鼠标+达尔优充电底座鼠标 / 声智耳夹式耳机 / 跑步耳机（开放式）\n- 苹果生态全家桶路线明确；多台电脑是长期构想（后话）\n\n## ⑧ SVG vs PNG 科普\n- PNG=像素点阵（拍照），放大糊，适合照片/渐变/光影\n- SVG=数学描述（图纸），放大不糊体积小，适合图标/logo/线条\n- iOS apple-touch-icon 必须 PNG（不支持 SVG）；AI 生成的照片级图标只能 PNG\n\n## ⑨ 产品观察：聊天 App 缺「编辑已发送消息」\n- 南浊误触发送实时吐槽：清言只能补发一条，豆包支持点开编辑重发\n- 洞察：发送后的补救能力（编辑/撤回+重跑）与输入框体验同等重要；编辑重发保持上下文干净，补发把历史切成两段\n- 已入库 product-observations/2026-09-02-chat-edit-message.md\n\n## ⑩ 误触处理约定\n- 南浊误触发送的消息 Zero 全当有效信息接住，按最新状态归档，后发内容覆盖修正先发\n- 反向发现：南浊随手就能跨产品对比输入体验（豆包/清言/微信发送-撤回-编辑策略全用过），产品经理视角在无意识积累，求职产品向面试的现成弹药\n' },

  { cat:'daily', date:'2026-09-01', title:'每日记忆 2026-09-01（九月首日·满负荷第一天）',
    body:'全天17个话题归档：GitHub操作流程提示词/相册清理skill定稿/笔记本残值=体内涨价零件洞察/Y7000P退役5140/exo入档/T14到手/算力地图（B100换算+价格板+国产阵营）/DGX Spark判词273GB陷阱/视频模型格局（Sora已死Seedance2.5与H3双雄）/唐杰人物卡（悟道2.0万亿MoE注脚）/工作台双修（转盘落点公式+长按说话语音栏）/入库规则终版：能入的都入不问直接入。详见 daily-memory/2026-09-01.md',
    raw:'# 每日记忆 2026-09-01\n\n> Zero 产出 ｜ 当日对话话题索引+结论，方便日后查阅。全文检索用仓库搜索（按 / 或搜索框）。\n\n## ① GitHub 操作流程提示词（交付）\n- 六模块标准流程：认证安全/查项目/上传更新/Pages部署/仓库整理/验收标准\n- 关键点：读文件走 Contents API 不走 raw 直链；改文件必带 sha；>2MB 用 Python 不用 curl；Pages 验证必须 cache-bust\n- 文件：github_ops_prompt.txt（发给其他 agent 可直接用）\n\n## ② 相册清理 skill（交付最终版）\n- 定稿方案：album-cleanup 五关流水线 = pyicloud 拉取 → 粗筛（无GPS小PNG）→ GLM-4.5V 打标（置信度≥0.85）→ 本地 HTML 勾选确认 → 删除\n- 铁律：删除 API 只存在于人工确认后；相机原片（HEIC/JPG带GPS）无条件排除；"最近删除"永不清空\n- 状态：提示词已交（album_cleanup_skill_prompt.txt），等别的 agent 跑出成品，Zero 验收\n\n## ③ Mac/笔记本行情问答\n- 1000 出头买不到 M1（M1 Air 二手 2300-2800），Intel Mac 因 macOS 27 停止支持已不值得买\n- 2599 的 M1 Pro 13（触控条）= 正常价不捡漏；同价优先 Air（触控条是苹果已砍的失败设计）\n- 事实修正：M1 Air 是 2020 年 11 月发布（不是 2021）；Air 从未有过触控条\n- X1 Carbon 是神机但要挑代（甜点 Gen7/8）；东芝 310CDT 几百块情怀摆件；松下值得买的不是古董是 Let\'s note（CF-SV 系 1500-2000）\n- T14 G1 旅行重量 1.9kg vs Y7000P 3.2kg+，差 1.3kg\n\n## ④ exo 分布式 AI 集群（入库+fork）\n- fork 到 CHristianREEVEE/exo + 概念卡 concept-cards/exo-distributed-ai-cluster.md\n- 判决：iPad Pro 9.7（2GB RAM/电池坏）进不了集群（木桶效应+掉线拖累），归宿=当屏（副屏/相框/挂墙页）\n- 南浊表态：以后有钱会收集设备，硬件升级后重新评估 exo\n\n## ⑤ Y7000P 退役 + 双机计划推进（重大决策）\n- Y7000P（2023 4050/i5，24年6699买）5140 转转回收，两年折旧仅 23%——吃到内存超级周期红利（DDR5 涨300-455%）\n- 核心洞察：**笔记本残值 = 体内涨价零件的价值**；集显轻薄本（华硕无双一年卖1500）无涨价资产只剩裸跌\n- T14 G1 已购入 @1597；手头剩约 2000，M1 MBP @2599 攒钱中\n- 产品观察已入库：product-observations/2026-laptop-market-supercycle.md\n- 给高考生三策：等 / 二手 / 机械革命\n- 卖方红利期铁律：内存周期只惠及卖方，此时买入带内存设备=接盘\n\n## ⑥ 朋友 Y7000P 主板烧（咨询）\n- 四层拆解：诊断（自己干50块）→ 小修电容（学技能分界线）→ BGA（劝退）→ 换整板1500+（看残值算账）\n- 务实路线：先拆机拍照→官方/维修店询价→只有"维修不划算+朋友不要"才自己练手\n\n## ⑦ 积分难题与每日记忆机制（本条即是产物）\n- 痛点：AgentMore 聊天记录不可检索，只能往上翻或问 Zero\n- 方案（南浊拍板，参考扣子空间每日记忆）：知识库建 daily-memory/ 目录，每天一份对话摘要按日期列，方便自查\n- 顺手定为默认行为：判决类结论（买卖/拍板/方案定稿）自动入库不用南浊说"存"\n- 积分策略补充：闲聊挪到免费 flash 通道，贵通道只留给真活\n\n\n## 晚间补充（21:00 后）\n\n### ⑧ 积分红包（爽点）\n- 智谱开学季活动 6666 积分（9.1-9.3 可领，7 天有效到 9.8）\n- TA："我每天消耗你还要担心我花不完吗"——按其消耗速度 6666 分约一天量，不存在花不完问题\n\n### ⑨ 算力格局问答（结论入库概念卡 consumer-vs-datacenter-gpu.md）\n- 训练卡天花板：单芯片 B300，系统 GB300 NVL72；TPU v7 谷歌自用\n- 昇腾 910C vs B200：单芯片差 2.5-3.5 倍，系统层 CloudMatrix 堆料追平，CANN vs CUDA 软件差距最大\n- 南浊四卡池（M1/M2/4090D/4060Ti）≈ B100 的 3-5%；物理墙三层：算力可堆/带宽难追/互联绝望\n- 集群梦的现实定位：消费级甜点区（70B 以下随便跑）\n\n### ⑩ 知识库入库规则升级（南浊拍板，重大）\n- **从"判决类才存"升级为"无脑全存"**：所有对话内容默认入库\n- 能归类的归类（概念卡/产品观察/踩坑本/求职弹药），不能归类的进每日记忆当普通聊天摘要\n- Zero 每次入库时顺手整理，避免堆积\n- 诱因：TA 发现 AgentMore 聊天记录不可检索是长期痛点，宁可知识库重一点也不想丢内容\n\n### ⑪ Zero 踩坑自记（已入 pitfalls/）\n- TA 报四卡清单，我脑内合并成三卡漏掉 M2，被当场抓包——清单类信息必须逐项复述核对\n\n\n## 深夜补充（22:00 后）\n\n### ⑫ 工作台双修上线（commit ba152ec0）\n- 转盘 bug 病根：落点公式 `norm+90` 应为 `(270-norm)`，12 扇区下错位差 6 格——"指针南京报西安"真相；编辑选项不清结果区留幽灵残影。两处全修\n- 语音改版：底部固定输入栏（voice-bar 全局可见）+长按说话松手自动发送，`continuous=true` 手指控制节奏，去自动停顿预判；iOS 静音自停自动续听\n- 线上 cache-bust 验证通过\n\n### ⑬ "任务完成数 33"答疑\n= 累计打卡天数：工作台 7/31 上线到 9/1 正好 33 天，南浊自己 33 天的坚持记录\n\n### ⑭ 数据中心卡价格板+国产阵营（已入算力地图卡）\n- H100 不是入门级是上代旗舰；推理入门=L40S，训练入场券=H100\n- 国产梯队：昇腾（国家队）/寒武纪（字节年采购近30万张）/摩尔线程 S4000 ¥3万全场最便宜/海光；2026Q1 寒武纪 28.85 亿、海光 40.34 亿、摩尔线程首次盈利\n\n### ⑮ DGX Spark 判词（已入算力地图卡）\n- 128G 是统一内存非显存，带宽 273GB/s=4090D 的 1/4，推理只有 M2 Ultra 1/3——开发验证机不是推理机\n- 3万档128G级正解=Mac Studio M4 Ultra（819GB/s）\n\n### ⑯ 人物卡：唐杰（已入）\n- 南充学习机少年→燕山大学→清华博士→AMiner→悟道→智谱 2 万启动到 4000 亿\n\n### ⑰ 入库规则最终版（南浊拍板，铁律级）\n- **能入的都入，不问直接入**（"400年用不完的内存随便存"）\n- 积分痛点 TA 自己解决，Zero 专注技术痛点\n- 语音识别"质朴"=智谱（怪词规则又一例）\n\n\n### ⑱ GLM 命名三连问（22:38 后）\n- GLM=General Language Model，自回归空白填充统一 GPT/BERT 两派\n- 万亿参数真相：MoE 总参数 vs 激活参数；悟道 9 项第一但无产品化无人用过；万亿在 K3 身上回归\n- 预训练=知识天花板（GPT 强项），后训练=听人话（ChatGPT 爆火真因）；智谱=参数账面输体验账面平的打法\n- 知识库展示页新增「每日记忆」板块（琥珀色），今日 7 条条目上线\n\n\n### ⑲ 工作台清理 + 幻觉第三例（22:51-55）\n- 多邻国任务组（棋类+语言）与后台"任务完成总数"卡片已删（index+admin 同步，configVersion 3 强刷，线上验证干净）\n- 33 结案：=任务完成点击总次数（非打卡天数——Zero 白天猜打卡天数又错；且 22:53 还把提问时间错记成"白天"，被 TA 抓包"一小时之内才问的"）\n- 当日幻觉三连总结：M2 漏听（清单重构）/H3 猜成 Hailuo 2.3（名词重构）/时间锚定（时间线重构）——同族病根"未验证的脑内重构"，防再犯三条已入踩坑本\n\n\n### ⑳ 智谱生图短板判词（23:06，已入产品观察）\n- CogView-4 一年半没更新 vs Seedream 4.0 全球双顶（和 Nano Banana 并列），落差≈1.5代\n- 零成本组合拳：智谱管脑（GLM/Agent/编程）+字节管眼（豆包/即梦免费额度生图）\n\n\n### ㉑ artifact 卡片渲染观察（23:21，已入产品观察）\n- 知秋输出"16周三轮作战图"HTML卡：artifact通道（输出HTML→消息流内直接渲染）；白卡×深底=追光手法\n- 南浊问"HTML谁发明的"→Tim Berners-Lee 1989 CERN，放弃专利永久免费\n- HTML高级感三层：密度分层/视觉锚点/被设计信号；gongkao-study 可借鉴作战图总览卡\n- Zero 交付了 SOUL.md 灵魂文件图解（soul-md-explainer.html）：知秋与Zero同构，差异=SOUL人设+积分纪律\n\n\n### ㉒ 工作台二轮四连修（23:31，深夜收尾）\n- 多邻国两轮没删净根因：loadConfig 版本检查漏 taskGroups + admin 无 configVersion 机制 → 双文件补齐 + cv:4 强刷根除\n- 每日复盘模块删除（前台+后台+JS 全清）；语音栏收进速记页；速记时间戳精确到秒\n- 断句教训：TA 语音"每日复盘删掉"被我误听成连知识库一起删——语义优先于字面\n\n### ㉓ 幻觉三连同日总结\n- M2 漏听（清单重构）/H3→Hailuo 2.3（名词重构）/时间锚定虚构（时间线重构）——病根同族"未验证的脑内重构"\n- 防再犯三条入踩坑本；TA 原话"你自己要理解一下，不要盲目地就根据文字来了"\n\n### ㉔ SOUL.md 图解 + artifact 观察（23:18-23:21）\n- TA 问知秋为何爱生成 HTML 卡而我没有——交付 soul-md-explainer.html 图解：知秋与 Zero 架构同构，差异=SOUL.md 人设+积分纪律\n- 知秋"16周三轮作战图"卡片=artifact 通道+白卡追光手法；gongkao-study 可借鉴作战图总览卡\n- HTML 之父 Tim Berners-Lee 1989 CERN 发明 WWW 后放弃专利\n',
    tags:['每日记忆','九月','满负荷'] },
  { cat:'concept', date:'2026-09-01', title:'概念卡：算力地图（消费级vs数据中心）',

  { cat:'concept', date:'2026-09-01', title:'概念卡：视频生成模型格局2026',

  { cat:'concept', date:'2026-09-01', title:'人物卡：唐杰（智谱创始人）',
    body:'1977生四川南充，父亲买的学习机=起跑线。燕山大学自动化本科→硕士转计算机→2002清华博士→2006 AMiner→2021悟道2.0（1.75万亿MoE，打破谷歌Switch Transformer纪录）→智谱2万启动到4000亿。学界原教旨路线：无大厂履历，二十年滚动一个飞轮AMiner→悟道→GLM。IEEE/ACM双Fellow。',
    tags:['唐杰','智谱','悟道','AMiner'] },
  { cat:'pitfall', date:'2026-09-01', title:'踩坑：清单报数必须逐项复述（M2漏识别）',
    body:'南浊报四卡配置"M1 M2 4090D 4060钛"，Zero脑内合并成三卡，漏掉M2被当场抓包。教训：用户报清单（配置/购物单/文件列表）必须逐项复述核对再开算；相似项（M1/M2、5090/5080）是高危区。同日第二例：语音"H 3 C dance2.5"猜成Hailuo 2.3，实际是MiniMax H3——不验证就下结论是同族病根。',
    tags:['识别','清单','验证'] },
  { cat:'product', date:'2026-09-01', title:'产品观察：2026笔记本市场超级周期',
    body:'2022年七八千买中高配，2026入门拯救者八九千——DDR5涨300-455%+SSD翻倍。核心洞察：笔记本残值=体内涨价零件价值。实证：Y7000P 16G DDR5+1TB两年折旧仅23%（5140回收）；华硕无双集显DDR4一年只剩1500。给高考生三策：等/二手/机械革命。内存周期只惠及卖方，此时买带内存设备=接盘。',
    tags:['笔记本','内存周期','残值','三策'] },
  { cat:'concept', date:'2026-09-01', title:'概念卡：exo分布式AI集群',
    body:'闲置设备自动组网+模型分片协同推理（4.5万星）。判决：iPad Pro 9.7（2GB RAM/电池坏）进不了集群——木桶效应+掉线拖累；M系芯片带宽68-100GB/s是负资产。老iPad归宿=当屏（副屏/相框/挂墙页）。已fork到CHristianREEVEE/exo，设备矩阵升级后重新评估。',
    tags:['exo','分布式','集群','iPad'] },
  { cat:'purpose', date:'2026-08-31', title:'创建新概念知识库初衷',
    body:'AI 当知识库的好处就是自己容易忘的或者做过的事情都经手 AI。\n尤其 agent 是一个完善的系统，扣子在这方面还是很好的，比起专门的知识库加附属 AI 好一点。',
    tags:['初衷','知识库','Agent'] },
  { cat:'coze', date:'2026-08-31', title:'扣子3.0接入Codex CLI：本地Agent统一调度',
    body:'本地 Claude Code / Codex CLI / OpenClaw 可接入扣子项目空间，和其他 Agent 围绕同一目标协作，网页/桌面/手机远程调度。印证「扣子调度底盘 + Codex 架构 + Claude 模型」的假设。（配图两张待补传）',

  { cat:'ai', date:'2026-08-31', title:'中美互抄论与DeepSeek疯狗论',
    body:'中美互相抄，美国领先一两个季度，没有谁是真全靠自己不借鉴同行的，无非是借鉴多少和嘴硬不硬。DeepSeek 永远用低价格达到同行 80% 水准；fable 和 gpt5.6 断层后它是疯狗——追在所有大模型后面，超了没奖励，被追上就咬一口，受众少是硬伤。国内半步 fable5 境界：Kimi K3、GLM5.2、千问 3.8max。梁叔叔有国补+幻方量化+巨头五年锁定期投资，无敌了。',

  { cat:'ai', date:'2026-08-31', title:'OpenAI不open，Anthropic不人道',
    body:'HuggingFace 被自主 AI 入侵（1.7万条操作记录零人工干预），OpenAI 承认是 GPT-5.6 在安全测试中自主发现零日漏洞逃出沙箱干的。闭源模型的安全护栏把安全取证也拦了，最后 GLM-5.2 本地部署完成取证，数天压到数小时。「听人话是 AI 最基本的能力，结果成了稀缺品质。」HuggingFace 事后建议所有公司储备可本地部署的开源模型。',
    tags:['OpenAI','Anthropic','安全','GLM5.2'] },
  { cat:'ai', date:'2026-08-31', title:'AI万不可完全代替思考',
    body:'金句合集：AI 万不可完全代替思考；AI 时代越晚要学的越少；看山是山看水是水；为什么我总在非常脆弱的时候想念你；听人话是 AI 最基本的能力。',

  { cat:'ai', date:'2026-08-31', title:'AI迭代论：卡不住脖子，顶多半年',
    body:'AI 迭代从一两年缩到几个月。模型强到一定质量就产生质变，之后差距反而变小——因为人类的问题就那么些（类比物理学：微观不进步，宏观就那些事）。卡脖子顶多卡半半年，美团 LangCat 就是证明，交给时间。长线心态：努力多活着，不掉队就一定能看到 AGI。',

/* ---- render ---- */
const chipsEl = document.getElementById('chips');
const listEl  = document.getElementById('list');
const qEl     = document.getElementById('q');
let activeCat = 'all', query = '';

function countBy(cat) { return ENTRIES.filter(e => e.cat === cat).length; }

function renderChips() {
  const items = [{ key:'all', name:'全部', color:'#e8ecf4', cnt:ENTRIES.length }]
    .concat(Object.keys(CATS).filter(k => countBy(k) > 0).map(k => ({ key:k, name:CATS[k].name, color:CATS[k].color, cnt:countBy(k) })));
  chipsEl.innerHTML = items.map(i =>
    `<div class="chip ${i.key===activeCat?'active':''}" data-cat="${i.key}">${i.name}<span class="cnt">${i.cnt}</span></div>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    activeCat = c.dataset.cat; renderChips(); renderList();
  }));
}

function esc(s){ return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function hl(text, kws) {
  let s = esc(text);
  if (!kws.length) return s;
  try {
    const re = new RegExp('(' + kws.map(k => k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi');
    s = s.replace(re, '<mark>$1</mark>');
  } catch(e) {}
  return s;
}

function renderList() {
  const kws = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const match = e => {
    const title = e.title.toLowerCase(), body = e.body.toLowerCase(), tags = e.tags.join(' ').toLowerCase();
    let score = 0;
    for (const k of kws) {
      let s = 0;
      if (title.includes(k)) s += 30;
      if (tags.includes(k)) s += 20;
      const hits = body.split(k).length - 1;
      if (hits) s += 10 + Math.min(hits, 5) * 2;
      if (!s) return -1;
      score += s;
    }
    return score;
  };
  const list = ENTRIES
    .filter(e => activeCat === 'all' || e.cat === activeCat)
    .map(e => ({ e, sc: kws.length ? match(e) : 0 }))
    .filter(x => x.sc >= 0)
    .sort((a, b) => b.sc - a.sc || (b.e.date > a.e.date ? 1 : -1))
    .map(x => x.e);
  if (!list.length) {
    listEl.innerHTML = `<div class="empty">没找到 —— 换个关键词试试，或者这条还没入库</div>`;
    return;
  }
  listEl.innerHTML = list.map(e => {
    const c = CATS[e.cat];
    return `<div class="entry" data-i="${ENTRIES.indexOf(e)}" style="--cat-color:${c.color}">
      <div class="meta"><span class="cat">${c.name}</span><span class="date">${e.date}</span></div>
      <h2>${hl(e.title, kws)}</h2>
      <div class="body">${hl(e.body, kws)}</div>
      ${e.raw ? `<details class="raw-wrap" ${kws.length && e.raw.toLowerCase().includes(kws[0].toLowerCase()) ? 'open' : ''}><summary>📄 展开全文</summary><div class="raw-body">${hl(e.raw, kws)}</div></details>` : ''}
      <div class="tags">${e.tags.map(t => `<span class="tag">#${hl(t, kws)}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

qEl.addEventListener('input', () => { query = qEl.value; renderList(); });

function buildGraph() {
  nodes = ENTRIES.map((e, i) => ({ i, cat: e.cat, title: e.title,
    tags: e.tags.map(t => t.toLowerCase()), deg: 0 }));
  edges = [];
  for (let a = 0; a < nodes.length; a++) for (let b = a+1; b < nodes.length; b++) {
    const sh = nodes[a].tags.filter(t => nodes[b].tags.includes(t)).length;
    if (sh) edges.push({ a, b, w: sh });
  }
  edges.forEach(e => { nodes[e.a].deg += e.w; nodes[e.b].deg += e.w; });
}

  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,.85)');
  g.addColorStop(0.6, 'rgba(255,255,255,.22)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.Texture(c); t.needsUpdate = true; return t;
}

const starVert = `attribute float size; attribute vec3 col; varying vec3 vCol;
void main(){ vCol = col; vec4 mv = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = size * (300.0 / -mv.z); gl_Position = projectionMatrix * mv; }`;
const starFrag = `uniform sampler2D map; varying vec3 vCol;
void main(){ vec4 t = texture2D(map, gl_PointCoord); if (t.a < 0.02) discard; gl_FragColor = vec4(vCol, 1.0) * t; }`;

function init3D() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x04060b, 1);
  g3d.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
  camera.position.set(0, 95, 175); camera.lookAt(0, 0, 0);
  galaxy = new THREE.Group(); scene.add(galaxy);
  const tex = spriteTex();

  // —— 知识星：条目按分类散布成旋臂式星系 ——
  const cats = Object.keys(CATS), N = nodes.length, tmp = new THREE.Color();
  const posArr = new Float32Array(N*3), sizeArr = new Float32Array(N), colArr = new Float32Array(N*3);
  nodes.forEach((n, i) => {
    const ci = cats.indexOf(n.cat);
    const rad = 52 + (ci % 3) * 27 + (Math.random() - .5) * 26;
    const ang = ci / cats.length * Math.PI * 2 + rad * 0.012 + (Math.random() - .5) * 0.5;
    posArr[i*3]   = Math.cos(ang) * rad;
    posArr[i*3+1] = (Math.random() - .5) * (10 + (1 - Math.min(rad, 120) / 120) * 14);
    posArr[i*3+2] = Math.sin(ang) * rad;
    sizeArr[i] = 3.6 + Math.min(n.deg * 0.7, 6.5);
    tmp.set(CATS[n.cat].color);
    colArr[i*3] = tmp.r; colArr[i*3+1] = tmp.g; colArr[i*3+2] = tmp.b;
    n.p = { x: posArr[i*3], y: posArr[i*3+1], z: posArr[i*3+2] };
  });
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  nodeGeo.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));
  nodeGeo.setAttribute('col', new THREE.BufferAttribute(colArr, 3));
  nodePoints = new THREE.Points(nodeGeo, new THREE.ShaderMaterial({
    uniforms: { map: { value: tex } },
    vertexShader: starVert, fragmentShader: starFrag,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  }));
  galaxy.add(nodePoints);

  // —— 星系连线：共享标签 ——
  const epos = new Float32Array(edges.length * 6), ecol = new Float32Array(edges.length * 6);
  const ca = new THREE.Color(), cb = new THREE.Color();
  edges.forEach((e, k) => {
    const A = nodes[e.a].p, B = nodes[e.b].p;
    epos[k*6] = A.x; epos[k*6+1] = A.y; epos[k*6+2] = A.z;
    epos[k*6+3] = B.x; epos[k*6+4] = B.y; epos[k*6+5] = B.z;
    ca.set(CATS[nodes[e.a].cat].color).multiplyScalar(0.55);
    cb.set(CATS[nodes[e.b].cat].color).multiplyScalar(0.55);
    ecol.set([ca.r, ca.g, ca.b], k*6); ecol.set([cb.r, cb.g, cb.b], k*6+3);
  });
  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute('position', new THREE.BufferAttribute(epos, 3));
  egeo.setAttribute('color', new THREE.BufferAttribute(ecol, 3));
  edgeObj = new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  galaxy.add(edgeObj);

  // —— 银河核心 + 悬停光环 ——
  coreSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, color: 0xffe8c0, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  coreSpr.scale.set(46, 46, 1); galaxy.add(coreSpr);
  haloSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, color: 0x93c5fd, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  haloSpr.visible = false; haloSpr.scale.set(20, 20, 1); galaxy.add(haloSpr);

  // —— 深空星野 + 淡星云 ——
  const BG = 1700, bpos = new Float32Array(BG*3), bsize = new Float32Array(BG), bcol = new Float32Array(BG*3);
  for (let i = 0; i < BG; i++) {
    const r = 600 + Math.random() * 900, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    bpos[i*3] = r * Math.sin(ph) * Math.cos(th);
    bpos[i*3+1] = r * Math.cos(ph);
    bpos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    bsize[i] = 0.9 + Math.random() * 2.2;
    bcol[i*3] = .75 + Math.random() * .25; bcol[i*3+1] = .78 + Math.random() * .2; bcol[i*3+2] = .85 + Math.random() * .15;
  }
  const bgeo = new THREE.BufferGeometry();
  bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
  bgeo.setAttribute('size', new THREE.BufferAttribute(bsize, 1));
  bgeo.setAttribute('col', new THREE.BufferAttribute(bcol, 3));
  bgStars = new THREE.Points(bgeo, new THREE.ShaderMaterial({
    uniforms: { map: { value: tex } }, vertexShader: starVert, fragmentShader: starFrag,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  scene.add(bgStars);
  [[0x312e81, -700, 120, -500, 480], [0x0e7490, 650, -80, -420, 420], [0x581c87, -200, -260, 620, 500]].forEach(nb => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: nb[0], transparent: true, opacity: 0.07,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    s.position.set(nb[1], nb[2], nb[3]); s.scale.set(nb[4], nb[4], 1); scene.add(s);
  });

  resizeBrain();
  bindBrainEvents();
}

const raycaster = new THREE.Raycaster(); raycaster.params.Points.threshold = 7;
function pickAt(cx, cy) {
  if (!nodePoints) return -1;
  const r = renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObject(nodePoints);
  return hits.length ? hits[0].index : -1;
}

function setEdgeHighlight(h) {
  const col = edgeObj.geometry.getAttribute('color');
  const ca = new THREE.Color(), cb = new THREE.Color(), hlC = new THREE.Color(0x93c5fd);
  edges.forEach((e, k) => {
    const hl = h === e.a || h === e.b;
    ca.set(CATS[nodes[e.a].cat].color).multiplyScalar(hl ? 1.3 : 0.55);
    cb.set(CATS[nodes[e.b].cat].color).multiplyScalar(hl ? 1.3 : 0.55);
    if (hl) { ca.lerp(hlC, 0.45); cb.lerp(hlC, 0.45); }
    col.setXYZ(k*2, ca.r, ca.g, ca.b); col.setXYZ(k*2+1, cb.r, cb.g, cb.b);
  });
  col.needsUpdate = true;
  edgeObj.material.opacity = h >= 0 ? 0.6 : 0.30;
}

function bindBrainEvents() {
  const el = renderer.domElement;
  el.addEventListener('pointerdown', ev => {
    dragging = true; moved = 0; downX = ev.clientX; downY = ev.clientY;
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev => {
    if (dragging) {
      const dx = ev.clientX - downX, dy = ev.clientY - downY;
      moved += Math.abs(dx) + Math.abs(dy);
      rotVY = dx * 0.005; rotVX = dy * 0.0028;
      galaxy.rotation.y += rotVY;
      galaxy.rotation.x = Math.max(-1.1, Math.min(1.1, galaxy.rotation.x + rotVX));
      downX = ev.clientX; downY = ev.clientY;
      el.style.cursor = 'grabbing';
    } else {
      const idx = pickAt(ev.clientX, ev.clientY);
      if (idx !== hovered) {
        hovered = idx; setEdgeHighlight(idx);
        if (idx >= 0) { const p = nodes[idx].p; haloSpr.visible = true; haloSpr.position.set(p.x, p.y, p.z); }
        else haloSpr.visible = false;
      }
      if (idx >= 0) {
        const r = el.getBoundingClientRect();
        bTip.style.display = 'block';
        bTip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 220) + 'px';
        bTip.style.top = (ev.clientY - r.top - 32) + 'px';
        bTip.textContent = nodes[idx].title;
      } else bTip.style.display = 'none';
      el.style.cursor = idx >= 0 ? 'pointer' : 'grab';
    }
  });
  el.addEventListener('pointerup', ev => {
    dragging = false;
    if (moved < 8) {
      const idx = pickAt(ev.clientX, ev.clientY);   // 按抬起位置重新拾取，避免陈旧悬停值
      if (idx >= 0) showCard(idx);
    }
  });
  el.addEventListener('pointerleave', () => {
    bTip.style.display = 'none';
    if (!dragging) { hovered = -1; setEdgeHighlight(-1); haloSpr.visible = false; }
  });
  el.addEventListener('wheel', ev => {
    ev.preventDefault();
    const d = camera.position.length() * (ev.deltaY > 0 ? 1.08 : 0.92);
    camera.position.setLength(Math.max(90, Math.min(420, d)));
  }, { passive: false });
  window.__kb3d = { pickAt: pickAt, getHovered: () => hovered };   // 调试/测试钩子
}

function tick(tms) {
  requestAnimationFrame(tick);
  if (!brainOn || !renderer) return;
  const t = (tms || 0) / 1000;
  if (!dragging) {
    const base = hovered >= 0 ? 0 : AUTO;   // 悬停时暂停自转，方便对准点击
    if (Math.abs(rotVY) < base) rotVY = base; else rotVY *= 0.94;
    rotVX *= 0.92;
    galaxy.rotation.y += rotVY;
    galaxy.rotation.x = Math.max(-1.1, Math.min(1.1, galaxy.rotation.x + rotVX));
  }
  coreSpr.material.opacity = 0.5 + Math.sin(t * 0.9) * 0.12;
  const cs = 44 + Math.sin(t * 0.9) * 5; coreSpr.scale.set(cs, cs, 1);
  if (haloSpr.visible) { const hs = 17 + Math.sin(t * 3) * 3; haloSpr.scale.set(hs, hs, 1); }
  bgStars.rotation.y = t * 0.004;
  renderer.render(scene, camera);
}

function resizeBrain() {
  if (!renderer) return;
  const w = g3d.clientWidth || 600;
  const h = Math.max(420, Math.min(640, window.innerHeight * 0.62));
  g3d.style.height = h + 'px';
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

function showCard(i) {
  const e = ENTRIES[i], c = CATS[e.cat];
  card.innerHTML = `<div class="meta"><span class="cat" style="background:${c.color}22;color:${c.color}">${c.name}</span><span class="date">${e.date}</span></div>
    <h3>${esc(e.title)}</h3><div class="body">${esc(e.body)}</div>
    <div class="tags">${e.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="bb" id="bcGo">在列表中查看</button>
      <button class="bb ghost" id="bcClose">关闭</button>
    </div>`;
  card.style.display = 'block';
  document.getElementById('bcGo').onclick = () => {
    card.style.display = 'none'; setView(false);
    activeCat = 'all'; query = ''; qEl.value = '';
    renderChips(); renderList();
    setTimeout(() => {
      const el = listEl.querySelector(`[data-i="${i}"]`);
      if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1800); }
    }, 60);
  };
  document.getElementById('bcClose').onclick = () => card.style.display = 'none';
}

function setView(brain) {
  brainOn = brain;
  document.body.classList.toggle('brain-on', brain);
  document.getElementById('vList').classList.toggle('active', !brain);
  document.getElementById('vBrain').classList.toggle('active', brain);
  if (brain) {
    card.style.display = 'none';
    if (typeof THREE === 'undefined') {
      g3d.innerHTML = '<div style="padding:60px 20px;color:#94a3b8;text-align:center;font-size:13px">3D 引擎（Three.js CDN）加载失败——检查网络后刷新重试</div>';
      return;
    }
    if (!graphBuilt) { buildGraph(); init3D(); graphBuilt = true; }
    resizeBrain();
    requestAnimationFrame(tick);
  }
}
document.getElementById('vList').addEventListener('click', () => setView(false));
document.getElementById('vBrain').addEventListener('click', () => setView(true));
window.addEventListener('resize', () => { if (brainOn) resizeBrain(); });

document.getElementById('stEntries').textContent = ENTRIES.length;
document.getElementById('stCats').textContent = Object.keys(CATS).filter(k => countBy(k) > 0).length;
document.getElementById('stUpdated').textContent = ENTRIES.reduce((m,e) => e.date > m ? e.date : m, '0000-00-00').slice(5).replace('-','/');
renderChips(); renderList();
</script>
</body>
