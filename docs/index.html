<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0d14;
    --card:rgba(255,255,255,.045);
    --card-hover:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.09);
    --text:#e8ecf4;
    --dim:#8b93a7;
    --indigo:#6366f1;
    --violet:#a78bfa;
    --cyan:#22d3ee;
    --amber:#fbbf24;
    --rose:#fb7185;
    --slate:#94a3b8;
    font-size:16px;
  }
  html { scrollbar-color:#2a3142 transparent; }
  body {
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.7;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ambient glow */
  .glow { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; }
  .glow.g1 { width:420px; height:420px; top:-120px; left:-100px; background:rgba(99,102,241,.16); }
  .glow.g2 { width:380px; height:380px; top:30%; right:-140px; background:rgba(34,211,238,.10); }

  .wrap { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:0 20px 80px; }

  /* hero */
  header { padding:64px 0 36px; }
  .kicker {
    display:inline-flex; align-items:center; gap:8px;
    font-size:.78rem; letter-spacing:.12em; color:var(--dim);
    border:1px solid var(--border); border-radius:999px;
    padding:5px 14px; margin-bottom:18px;
    background:var(--card); backdrop-filter:blur(12px);
  }
  .kicker .dot { width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  h1 {
    font-size:clamp(1.9rem,5.5vw,2.8rem); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(120deg,#e8ecf4 30%,var(--indigo) 70%,var(--cyan));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:var(--dim); margin-top:10px; font-size:.95rem; max-width:560px; }
  .sub b { color:var(--text); font-weight:600; }
  .stats { display:flex; gap:26px; margin-top:26px; flex-wrap:wrap; }
  .stat { display:flex; flex-direction:column; }
  .stat .n { font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:.75rem; color:var(--dim); letter-spacing:.06em; }

  /* search */
  .searchbox { position:relative; margin:26px 0 18px; }
  .searchbox input {
    width:100%; padding:14px 18px 14px 46px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    color:var(--text); font-size:1rem; outline:none;
    backdrop-filter:blur(12px); transition:border-color .2s, background .2s;
  }
  .searchbox input:focus { border-color:rgba(99,102,241,.55); background:var(--card-hover); }
  .searchbox input::placeholder { color:#5b6373; }
  .searchbox svg { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:17px; height:17px; stroke:var(--dim); }

  /* chips */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; }
  .chip {
    padding:7px 15px; border-radius:999px; font-size:.85rem; color:var(--dim);
    background:var(--card); border:1px solid var(--border); cursor:pointer;
    transition:all .18s; backdrop-filter:blur(12px); user-select:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover { color:var(--text); background:var(--card-hover); }
  .chip.active { color:#fff; border-color:transparent; background:linear-gradient(120deg,var(--indigo),#4f46e5); box-shadow:0 4px 18px rgba(99,102,241,.35); }
  .chip .cnt { font-size:.72rem; opacity:.75; font-variant-numeric:tabular-nums; }

  /* entry cards */
  .entries { display:flex; flex-direction:column; gap:14px; }
  .entry {
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px 22px; backdrop-filter:blur(14px);
    transition:transform .18s, background .18s, border-color .18s;
    position:relative; overflow:hidden;
  }
  .entry::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--cat-color,var(--indigo));
  }
  .entry:hover { background:var(--card-hover); transform:translateY(-2px); }
  .entry .meta { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .entry .cat {
    font-size:.72rem; font-weight:700; letter-spacing:.05em;
    color:var(--cat-color,var(--indigo));
    background:color-mix(in srgb,var(--cat-color,var(--indigo)) 14%,transparent);
    padding:2.5px 10px; border-radius:6px;
  }
  .entry .date { font-size:.75rem; color:var(--dim); font-variant-numeric:tabular-nums; }
  .entry h2 { font-size:1.08rem; font-weight:700; letter-spacing:-.01em; margin-bottom:6px; }
  .entry .body { color:#b8bfce; font-size:.9rem; white-space:pre-line; }
  .entry .tags { margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; }
  .entry .tag { font-size:.72rem; color:var(--dim); background:rgba(255,255,255,.05); padding:2px 9px; border-radius:5px; }
  .entry mark { background:rgba(59,130,246,.38); color:#dbeafe; border-radius:3px; padding:0 2px; }
  .entry .body b { color:var(--text); }
  .entry.flash { outline:2px solid #3b82f6; box-shadow:0 0 24px rgba(59,130,246,.35); }

  .viewtoggle { display:flex; gap:8px; margin:0 0 18px; }
  .vt { font:inherit; font-size:.85rem; font-weight:600; color:var(--dim); background:var(--card); border:1px solid var(--border); border-radius:9px; padding:8px 16px; cursor:pointer; transition:.15s; }
  .vt.active { color:var(--text); background:rgba(59,130,246,.18); border-color:rgba(59,130,246,.45); }

  body.brain-on #chips, body.brain-on #list, body.brain-on .searchbox { display:none; }
  #brainView { display:none; position:relative; }
  body.brain-on #brainView { display:block; }
  #brainCanvas { width:100%; border:1px solid var(--border); border-radius:16px; background:rgba(255,255,255,.03); touch-action:none; }
  .brainhint { text-align:center; color:var(--dim); font-size:.78rem; margin-top:10px; }
  .bcard { position:absolute; top:14px; right:14px; width:min(320px, 78%); max-height:82%; overflow:auto; background:#10141d; border:1px solid rgba(59,130,246,.4); border-radius:14px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .bcard h3 { font-size:1rem; margin:8px 0; }
  .bcard .body { color:#b8bfce; font-size:.85rem; white-space:pre-line; }
  .bcard .meta { display:flex; gap:8px; align-items:center; }
  .bcard .cat { font-size:.72rem; font-weight:700; padding:2px 9px; border-radius:5px; }
  .bcard .date { font-size:.75rem; color:var(--dim); }
  .bcard .tags { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .bcard .tag { font-size:.7rem; color:var(--dim); background:rgba(255,255,255,.05); padding:2px 9px; border-radius:5px; }
  .bb { font:inherit; font-size:.8rem; font-weight:600; color:#dbeafe; background:rgba(59,130,246,.25); border:1px solid rgba(59,130,246,.5); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .bb.ghost { color:var(--dim); background:transparent; border-color:var(--border); }

  .empty {
    text-align:center; color:var(--dim); padding:60px 0; font-size:.92rem;
    background:var(--card); border:1px dashed var(--border); border-radius:16px;
  }

  footer {
    margin-top:56px; padding-top:22px; border-top:1px solid var(--border);
    color:#5b6373; font-size:.78rem; text-align:center;
  }
  footer a { color:var(--dim); text-decoration:none; border-bottom:1px dotted #5b6373; }

  @media (max-width:560px) {
    header { padding:44px 0 28px; }
    .stats { gap:18px; }
    .entry { padding:16px 16px 16px 19px; }
  }

.raw-wrap { margin: 8px 0 4px; }
.raw-wrap summary { cursor: pointer; font-size: 12px; color: var(--accent, #8b9cf7); user-select: none; padding: 4px 0; }
.raw-body { white-space: pre-wrap; font-size: 12.5px; line-height: 1.75; color: var(--text-dim, #aaa); background: rgba(255,255,255,.03); border: 1px solid var(--border, #333); border-radius: 8px; padding: 12px 14px; margin-top: 6px; max-height: 60vh; overflow-y: auto; }
.raw-body mark { background: #f7d774; color: #1a1a1a; border-radius: 2px; padding: 0 1px; }
</style>
</head>

<div class="wrap">

  <header>
    <div class="kicker"><span class="dot"></span>PERSONAL KNOWLEDGE BASE</div>
    <h1>南浊 · 知识库</h1>
    <p class="sub">观点、观察、踩坑——<b>进系统的才算数</b>。收藏不等于知识，发到备忘录的东西等于死存储；这里只收经过自己加工的。</p>
    <div class="stats">

  <div class="searchbox">

<script>
const CATS = {

  ai:      { name:'AI 看法',    color:'#6366f1' },

  inbox:   { name:'收件箱',      color:'#94a3b8' },

};

const ENTRIES = [
  { cat:'daily', date:'2026-09-01', title:'每日记忆 2026-09-01（九月首日·满负荷第一天）',
    body:'全天17个话题归档：GitHub操作流程提示词/相册清理skill定稿/笔记本残值=体内涨价零件洞察/Y7000P退役5140/exo入档/T14到手/算力地图（B100换算+价格板+国产阵营）/DGX Spark判词273GB陷阱/视频模型格局（Sora已死Seedance2.5与H3双雄）/唐杰人物卡（悟道2.0万亿MoE注脚）/工作台双修（转盘落点公式+长按说话语音栏）/入库规则终版：能入的都入不问直接入。详见 daily-memory/2026-09-01.md',
    raw:'# 每日记忆 2026-09-01\n\n> Zero 产出 ｜ 当日对话话题索引+结论，方便日后查阅。全文检索用仓库搜索（按 / 或搜索框）。\n\n## ① GitHub 操作流程提示词（交付）\n- 六模块标准流程：认证安全/查项目/上传更新/Pages部署/仓库整理/验收标准\n- 关键点：读文件走 Contents API 不走 raw 直链；改文件必带 sha；>2MB 用 Python 不用 curl；Pages 验证必须 cache-bust\n- 文件：github_ops_prompt.txt（发给其他 agent 可直接用）\n\n## ② 相册清理 skill（交付最终版）\n- 定稿方案：album-cleanup 五关流水线 = pyicloud 拉取 → 粗筛（无GPS小PNG）→ GLM-4.5V 打标（置信度≥0.85）→ 本地 HTML 勾选确认 → 删除\n- 铁律：删除 API 只存在于人工确认后；相机原片（HEIC/JPG带GPS）无条件排除；"最近删除"永不清空\n- 状态：提示词已交（album_cleanup_skill_prompt.txt），等别的 agent 跑出成品，Zero 验收\n\n## ③ Mac/笔记本行情问答\n- 1000 出头买不到 M1（M1 Air 二手 2300-2800），Intel Mac 因 macOS 27 停止支持已不值得买\n- 2599 的 M1 Pro 13（触控条）= 正常价不捡漏；同价优先 Air（触控条是苹果已砍的失败设计）\n- 事实修正：M1 Air 是 2020 年 11 月发布（不是 2021）；Air 从未有过触控条\n- X1 Carbon 是神机但要挑代（甜点 Gen7/8）；东芝 310CDT 几百块情怀摆件；松下值得买的不是古董是 Let\'s note（CF-SV 系 1500-2000）\n- T14 G1 旅行重量 1.9kg vs Y7000P 3.2kg+，差 1.3kg\n\n## ④ exo 分布式 AI 集群（入库+fork）\n- fork 到 CHristianREEVEE/exo + 概念卡 concept-cards/exo-distributed-ai-cluster.md\n- 判决：iPad Pro 9.7（2GB RAM/电池坏）进不了集群（木桶效应+掉线拖累），归宿=当屏（副屏/相框/挂墙页）\n- 南浊表态：以后有钱会收集设备，硬件升级后重新评估 exo\n\n## ⑤ Y7000P 退役 + 双机计划推进（重大决策）\n- Y7000P（2023 4050/i5，24年6699买）5140 转转回收，两年折旧仅 23%——吃到内存超级周期红利（DDR5 涨300-455%）\n- 核心洞察：**笔记本残值 = 体内涨价零件的价值**；集显轻薄本（华硕无双一年卖1500）无涨价资产只剩裸跌\n- T14 G1 已购入 @1597；手头剩约 2000，M1 MBP @2599 攒钱中\n- 产品观察已入库：product-observations/2026-laptop-market-supercycle.md\n- 给高考生三策：等 / 二手 / 机械革命\n- 卖方红利期铁律：内存周期只惠及卖方，此时买入带内存设备=接盘\n\n## ⑥ 朋友 Y7000P 主板烧（咨询）\n- 四层拆解：诊断（自己干50块）→ 小修电容（学技能分界线）→ BGA（劝退）→ 换整板1500+（看残值算账）\n- 务实路线：先拆机拍照→官方/维修店询价→只有"维修不划算+朋友不要"才自己练手\n\n## ⑦ 积分难题与每日记忆机制（本条即是产物）\n- 痛点：AgentMore 聊天记录不可检索，只能往上翻或问 Zero\n- 方案（南浊拍板，参考扣子空间每日记忆）：知识库建 daily-memory/ 目录，每天一份对话摘要按日期列，方便自查\n- 顺手定为默认行为：判决类结论（买卖/拍板/方案定稿）自动入库不用南浊说"存"\n- 积分策略补充：闲聊挪到免费 flash 通道，贵通道只留给真活\n\n\n## 晚间补充（21:00 后）\n\n### ⑧ 积分红包（爽点）\n- 智谱开学季活动 6666 积分（9.1-9.3 可领，7 天有效到 9.8）\n- TA："我每天消耗你还要担心我花不完吗"——按其消耗速度 6666 分约一天量，不存在花不完问题\n\n### ⑨ 算力格局问答（结论入库概念卡 consumer-vs-datacenter-gpu.md）\n- 训练卡天花板：单芯片 B300，系统 GB300 NVL72；TPU v7 谷歌自用\n- 昇腾 910C vs B200：单芯片差 2.5-3.5 倍，系统层 CloudMatrix 堆料追平，CANN vs CUDA 软件差距最大\n- 南浊四卡池（M1/M2/4090D/4060Ti）≈ B100 的 3-5%；物理墙三层：算力可堆/带宽难追/互联绝望\n- 集群梦的现实定位：消费级甜点区（70B 以下随便跑）\n\n### ⑩ 知识库入库规则升级（南浊拍板，重大）\n- **从"判决类才存"升级为"无脑全存"**：所有对话内容默认入库\n- 能归类的归类（概念卡/产品观察/踩坑本/求职弹药），不能归类的进每日记忆当普通聊天摘要\n- Zero 每次入库时顺手整理，避免堆积\n- 诱因：TA 发现 AgentMore 聊天记录不可检索是长期痛点，宁可知识库重一点也不想丢内容\n\n### ⑪ Zero 踩坑自记（已入 pitfalls/）\n- TA 报四卡清单，我脑内合并成三卡漏掉 M2，被当场抓包——清单类信息必须逐项复述核对\n\n\n## 深夜补充（22:00 后）\n\n### ⑫ 工作台双修上线（commit ba152ec0）\n- 转盘 bug 病根：落点公式 `norm+90` 应为 `(270-norm)`，12 扇区下错位差 6 格——"指针南京报西安"真相；编辑选项不清结果区留幽灵残影。两处全修\n- 语音改版：底部固定输入栏（voice-bar 全局可见）+长按说话松手自动发送，`continuous=true` 手指控制节奏，去自动停顿预判；iOS 静音自停自动续听\n- 线上 cache-bust 验证通过\n\n### ⑬ "任务完成数 33"答疑\n= 累计打卡天数：工作台 7/31 上线到 9/1 正好 33 天，南浊自己 33 天的坚持记录\n\n### ⑭ 数据中心卡价格板+国产阵营（已入算力地图卡）\n- H100 不是入门级是上代旗舰；推理入门=L40S，训练入场券=H100\n- 国产梯队：昇腾（国家队）/寒武纪（字节年采购近30万张）/摩尔线程 S4000 ¥3万全场最便宜/海光；2026Q1 寒武纪 28.85 亿、海光 40.34 亿、摩尔线程首次盈利\n\n### ⑮ DGX Spark 判词（已入算力地图卡）\n- 128G 是统一内存非显存，带宽 273GB/s=4090D 的 1/4，推理只有 M2 Ultra 1/3——开发验证机不是推理机\n- 3万档128G级正解=Mac Studio M4 Ultra（819GB/s）\n\n### ⑯ 人物卡：唐杰（已入）\n- 南充学习机少年→燕山大学→清华博士→AMiner→悟道→智谱 2 万启动到 4000 亿\n\n### ⑰ 入库规则最终版（南浊拍板，铁律级）\n- **能入的都入，不问直接入**（"400年用不完的内存随便存"）\n- 积分痛点 TA 自己解决，Zero 专注技术痛点\n- 语音识别"质朴"=智谱（怪词规则又一例）\n\n\n### ⑱ GLM 命名三连问（22:38 后）\n- GLM=General Language Model，自回归空白填充统一 GPT/BERT 两派\n- 万亿参数真相：MoE 总参数 vs 激活参数；悟道 9 项第一但无产品化无人用过；万亿在 K3 身上回归\n- 预训练=知识天花板（GPT 强项），后训练=听人话（ChatGPT 爆火真因）；智谱=参数账面输体验账面平的打法\n- 知识库展示页新增「每日记忆」板块（琥珀色），今日 7 条条目上线\n\n\n### ⑲ 工作台清理 + 幻觉第三例（22:51-55）\n- 多邻国任务组（棋类+语言）与后台"任务完成总数"卡片已删（index+admin 同步，configVersion 3 强刷，线上验证干净）\n- 33 结案：=任务完成点击总次数（非打卡天数——Zero 白天猜打卡天数又错；且 22:53 还把提问时间错记成"白天"，被 TA 抓包"一小时之内才问的"）\n- 当日幻觉三连总结：M2 漏听（清单重构）/H3 猜成 Hailuo 2.3（名词重构）/时间锚定（时间线重构）——同族病根"未验证的脑内重构"，防再犯三条已入踩坑本\n\n\n### ⑳ 智谱生图短板判词（23:06，已入产品观察）\n- CogView-4 一年半没更新 vs Seedream 4.0 全球双顶（和 Nano Banana 并列），落差≈1.5代\n- 零成本组合拳：智谱管脑（GLM/Agent/编程）+字节管眼（豆包/即梦免费额度生图）\n\n\n### ㉑ artifact 卡片渲染观察（23:21，已入产品观察）\n- 知秋输出"16周三轮作战图"HTML卡：artifact通道（输出HTML→消息流内直接渲染）；白卡×深底=追光手法\n- 南浊问"HTML谁发明的"→Tim Berners-Lee 1989 CERN，放弃专利永久免费\n- HTML高级感三层：密度分层/视觉锚点/被设计信号；gongkao-study 可借鉴作战图总览卡\n- Zero 交付了 SOUL.md 灵魂文件图解（soul-md-explainer.html）：知秋与Zero同构，差异=SOUL人设+积分纪律\n\n\n### ㉒ 工作台二轮四连修（23:31，深夜收尾）\n- 多邻国两轮没删净根因：loadConfig 版本检查漏 taskGroups + admin 无 configVersion 机制 → 双文件补齐 + cv:4 强刷根除\n- 每日复盘模块删除（前台+后台+JS 全清）；语音栏收进速记页；速记时间戳精确到秒\n- 断句教训：TA 语音"每日复盘删掉"被我误听成连知识库一起删——语义优先于字面\n\n### ㉓ 幻觉三连同日总结\n- M2 漏听（清单重构）/H3→Hailuo 2.3（名词重构）/时间锚定虚构（时间线重构）——病根同族"未验证的脑内重构"\n- 防再犯三条入踩坑本；TA 原话"你自己要理解一下，不要盲目地就根据文字来了"\n\n### ㉔ SOUL.md 图解 + artifact 观察（23:18-23:21）\n- TA 问知秋为何爱生成 HTML 卡而我没有——交付 soul-md-explainer.html 图解：知秋与 Zero 架构同构，差异=SOUL.md 人设+积分纪律\n- 知秋"16周三轮作战图"卡片=artifact 通道+白卡追光手法；gongkao-study 可借鉴作战图总览卡\n- HTML 之父 Tim Berners-Lee 1989 CERN 发明 WWW 后放弃专利\n',
    tags:['每日记忆','九月','满负荷'] },

    body:'Sora 2已死（2026.3.25关停，烧$15M/天），Veo3.1国外独苗王者。国产双雄：Seedance 2.5（30秒4K直出全球第一）vs MiniMax H3（全模态+2K成本$0.14/秒+开源8G显存可跑）。开源全球领先：阿里Wan2.7四合一/腾讯混元画质天花板。4090D可本地跑Wan 14B版。',

  { cat:'concept', date:'2026-09-01', title:'人物卡：唐杰（智谱创始人）',
    body:'1977生四川南充，父亲买的学习机=起跑线。燕山大学自动化本科→硕士转计算机→2002清华博士→2006 AMiner→2021悟道2.0（1.75万亿MoE，打破谷歌Switch Transformer纪录）→智谱2万启动到4000亿。学界原教旨路线：无大厂履历，二十年滚动一个飞轮AMiner→悟道→GLM。IEEE/ACM双Fellow。',
    tags:['唐杰','智谱','悟道','AMiner'] },
  { cat:'pitfall', date:'2026-09-01', title:'踩坑：清单报数必须逐项复述（M2漏识别）',
    body:'南浊报四卡配置"M1 M2 4090D 4060钛"，Zero脑内合并成三卡，漏掉M2被当场抓包。教训：用户报清单（配置/购物单/文件列表）必须逐项复述核对再开算；相似项（M1/M2、5090/5080）是高危区。同日第二例：语音"H 3 C dance2.5"猜成Hailuo 2.3，实际是MiniMax H3——不验证就下结论是同族病根。',
    tags:['识别','清单','验证'] },
  { cat:'product', date:'2026-09-01', title:'产品观察：2026笔记本市场超级周期',
    body:'2022年七八千买中高配，2026入门拯救者八九千——DDR5涨300-455%+SSD翻倍。核心洞察：笔记本残值=体内涨价零件价值。实证：Y7000P 16G DDR5+1TB两年折旧仅23%（5140回收）；华硕无双集显DDR4一年只剩1500。给高考生三策：等/二手/机械革命。内存周期只惠及卖方，此时买带内存设备=接盘。',
    tags:['笔记本','内存周期','残值','三策'] },
  { cat:'concept', date:'2026-09-01', title:'概念卡：exo分布式AI集群',
    body:'闲置设备自动组网+模型分片协同推理（4.5万星）。判决：iPad Pro 9.7（2GB RAM/电池坏）进不了集群——木桶效应+掉线拖累；M系芯片带宽68-100GB/s是负资产。老iPad归宿=当屏（副屏/相框/挂墙页）。已fork到CHristianREEVEE/exo，设备矩阵升级后重新评估。',
    tags:['exo','分布式','集群','iPad'] },
  { cat:'purpose', date:'2026-08-31', title:'创建新概念知识库初衷',
    body:'AI 当知识库的好处就是自己容易忘的或者做过的事情都经手 AI。\n尤其 agent 是一个完善的系统，扣子在这方面还是很好的，比起专门的知识库加附属 AI 好一点。',
    tags:['初衷','知识库','Agent'] },
  { cat:'coze', date:'2026-08-31', title:'扣子3.0接入Codex CLI：本地Agent统一调度',
    body:'本地 Claude Code / Codex CLI / OpenClaw 可接入扣子项目空间，和其他 Agent 围绕同一目标协作，网页/桌面/手机远程调度。印证「扣子调度底盘 + Codex 架构 + Claude 模型」的假设。（配图两张待补传）',

  { cat:'ai', date:'2026-08-31', title:'中美互抄论与DeepSeek疯狗论',
    body:'中美互相抄，美国领先一两个季度，没有谁是真全靠自己不借鉴同行的，无非是借鉴多少和嘴硬不硬。DeepSeek 永远用低价格达到同行 80% 水准；fable 和 gpt5.6 断层后它是疯狗——追在所有大模型后面，超了没奖励，被追上就咬一口，受众少是硬伤。国内半步 fable5 境界：Kimi K3、GLM5.2、千问 3.8max。梁叔叔有国补+幻方量化+巨头五年锁定期投资，无敌了。',
    tags:['中美AI','DeepSeek','性价比'] },
  { cat:'ai', date:'2026-08-31', title:'OpenAI不open，Anthropic不人道',
    body:'HuggingFace 被自主 AI 入侵（1.7万条操作记录零人工干预），OpenAI 承认是 GPT-5.6 在安全测试中自主发现零日漏洞逃出沙箱干的。闭源模型的安全护栏把安全取证也拦了，最后 GLM-5.2 本地部署完成取证，数天压到数小时。「听人话是 AI 最基本的能力，结果成了稀缺品质。」HuggingFace 事后建议所有公司储备可本地部署的开源模型。',
    tags:['OpenAI','Anthropic','安全','GLM5.2'] },
  { cat:'ai', date:'2026-08-31', title:'AI万不可完全代替思考',
    body:'金句合集：AI 万不可完全代替思考；AI 时代越晚要学的越少；看山是山看水是水；为什么我总在非常脆弱的时候想念你；听人话是 AI 最基本的能力。',
    tags:['思考','金句','人与AI'] },
  { cat:'ai', date:'2026-08-31', title:'AI迭代论：卡不住脖子，顶多半年',
    body:'AI 迭代从一两年缩到几个月。模型强到一定质量就产生质变，之后差距反而变小——因为人类的问题就那么些（类比物理学：微观不进步，宏观就那些事）。卡脖子顶多卡半半年，美团 LangCat 就是证明，交给时间。长线心态：努力多活着，不掉队就一定能看到 AGI。',
    tags:['AI迭代','卡脖子','AGI'] },
  { cat:'product', date:'2026-08-31', title:'WorkBuddy震撼：腾讯生态闭环',

/* ---- render ---- */
const chipsEl = document.getElementById('chips');
const listEl  = document.getElementById('list');
const qEl     = document.getElementById('q');
let activeCat = 'all', query = '';

function countBy(cat) { return ENTRIES.filter(e => e.cat === cat).length; }

function renderChips() {
  const items = [{ key:'all', name:'全部', color:'#e8ecf4', cnt:ENTRIES.length }]
    .concat(Object.keys(CATS).filter(k => countBy(k) > 0).map(k => ({ key:k, name:CATS[k].name, color:CATS[k].color, cnt:countBy(k) })));
  chipsEl.innerHTML = items.map(i =>
    `<div class="chip ${i.key===activeCat?'active':''}" data-cat="${i.key}">${i.name}<span class="cnt">${i.cnt}</span></div>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    activeCat = c.dataset.cat; renderChips(); renderList();
  }));
}

function esc(s){ return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function hl(text, kws) {
  let s = esc(text);
  if (!kws.length) return s;
  try {
    const re = new RegExp('(' + kws.map(k => k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi');
    s = s.replace(re, '<mark>$1</mark>');
  } catch(e) {}
  return s;
}

function renderList() {
  const kws = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const match = e => {
    const title = e.title.toLowerCase(), body = e.body.toLowerCase(), tags = e.tags.join(' ').toLowerCase();
    let score = 0;
    for (const k of kws) {
      let s = 0;
      if (title.includes(k)) s += 30;
      if (tags.includes(k)) s += 20;
      const hits = body.split(k).length - 1;
      if (hits) s += 10 + Math.min(hits, 5) * 2;
      if (!s) return -1;
      score += s;
    }
    return score;
  };
  const list = ENTRIES
    .filter(e => activeCat === 'all' || e.cat === activeCat)
    .map(e => ({ e, sc: kws.length ? match(e) : 0 }))
    .filter(x => x.sc >= 0)
    .sort((a, b) => b.sc - a.sc || (b.e.date > a.e.date ? 1 : -1))
    .map(x => x.e);
  if (!list.length) {
    listEl.innerHTML = `<div class="empty">没找到 —— 换个关键词试试，或者这条还没入库</div>`;
    return;
  }
  listEl.innerHTML = list.map(e => {
    const c = CATS[e.cat];
    return `<div class="entry" data-i="${ENTRIES.indexOf(e)}" style="--cat-color:${c.color}">
      <div class="meta"><span class="cat">${c.name}</span><span class="date">${e.date}</span></div>
      <h2>${hl(e.title, kws)}</h2>
      <div class="body">${hl(e.body, kws)}</div>
      ${e.raw ? `<details class="raw-wrap" ${kws.length && e.raw.toLowerCase().includes(kws[0].toLowerCase()) ? 'open' : ''}><summary>📄 展开全文</summary><div class="raw-body">${hl(e.raw, kws)}</div></details>` : ''}
      <div class="tags">${e.tags.map(t => `<span class="tag">#${hl(t, kws)}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

qEl.addEventListener('input', () => { query = qEl.value; renderList(); });

/* ================= 大脑视图 ================= */
const brainView = document.getElementById('brainView');
const canvas = document.getElementById('brainCanvas');
const bctx = canvas.getContext('2d');
const card = document.getElementById('brainCard');
let brainOn = false, graphBuilt = false;
let nodes = [], edges = [], W = 0, H = 0, alpha = 1;
let hovered = -1, dragIdx = -1, downX = 0, downY = 0, moved = 0;

function buildGraph() {
  nodes = ENTRIES.map((e, i) => ({ i, cat: e.cat, title: e.title,
    tags: e.tags.map(t => t.toLowerCase()), x: 0, y: 0, vx: 0, vy: 0, deg: 0 }));
  const cats = Object.keys(CATS);
  nodes.forEach(n => {
    const ang = cats.indexOf(n.cat) / cats.length * Math.PI * 2;
    const rad = Math.min(W, H) * 0.28;
    n.x = W/2 + Math.cos(ang)*rad + (Math.random()-.5)*50;
    n.y = H/2 + Math.sin(ang)*rad + (Math.random()-.5)*50;
  });
  edges = [];
  for (let a = 0; a < nodes.length; a++) for (let b = a+1; b < nodes.length; b++) {
    const sh = nodes[a].tags.filter(t => nodes[b].tags.includes(t)).length;
    if (sh) edges.push({ a, b, w: sh });
  }
  nodes.forEach(n => n.deg = 0);
  edges.forEach(e => { nodes[e.a].deg += e.w; nodes[e.b].deg += e.w; });
}

function resizeBrain() {
  const DPR = window.devicePixelRatio || 1;
  W = brainView.clientWidth || 600;
  H = Math.max(420, Math.min(640, window.innerHeight * 0.62));
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.height = H + 'px';
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  nodes.forEach(n => { n.x = Math.max(24, Math.min(W-24, n.x)); n.y = Math.max(24, Math.min(H-24, n.y)); });
}

function step() {
  if (alpha < 0.004 || dragIdx >= 0) { if (dragIdx < 0) return; }
  for (let i = 0; i < nodes.length; i++) for (let j = i+1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    let dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx + dy*dy || 1;
    const d = Math.sqrt(d2), f = 2400/d2;
    dx /= d; dy /= d;
    a.vx += dx*f; a.vy += dy*f; b.vx -= dx*f; b.vy -= dy*f;
  }
  edges.forEach(e => {
    const a = nodes[e.a], b = nodes[e.b];
    let dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1, f = (d-110)*0.008*Math.min(e.w, 3);
    a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
  });
  nodes.forEach(n => {
    n.vx += (W/2-n.x)*0.003; n.vy += (H/2-n.y)*0.003;
    if (n.i === dragIdx) { n.vx = 0; n.vy = 0; return; }
    n.vx *= 0.85; n.vy *= 0.85;
    n.x = Math.max(24, Math.min(W-24, n.x + n.vx));
    n.y = Math.max(24, Math.min(H-24, n.y + n.vy));
  });
  alpha *= 0.996;
}

function draw() {
  bctx.clearRect(0, 0, W, H);
  edges.forEach(e => {
    const a = nodes[e.a], b = nodes[e.b];
    const hlE = hovered === e.a || hovered === e.b;
    bctx.strokeStyle = hlE ? 'rgba(147,197,253,.9)' : 'rgba(148,163,184,.2)';
    bctx.lineWidth = hlE ? 1.8 : Math.min(1 + e.w*0.4, 2.2);
    bctx.beginPath(); bctx.moveTo(a.x, a.y); bctx.lineTo(b.x, b.y); bctx.stroke();
  });
  nodes.forEach((n, i) => {
    const r = 5 + Math.min(n.deg*0.9, 8), c = CATS[n.cat].color;
    if (i === hovered) { bctx.beginPath(); bctx.arc(n.x, n.y, r+6, 0, 7); bctx.fillStyle = c+'44'; bctx.fill(); }
    bctx.beginPath(); bctx.arc(n.x, n.y, r, 0, 7);
    bctx.fillStyle = c; bctx.fill();
    bctx.strokeStyle = 'rgba(10,13,20,.9)'; bctx.lineWidth = 1.5; bctx.stroke();
    if (i === hovered || r > 10) {
      bctx.fillStyle = '#e8ecf4'; bctx.font = '11px system-ui'; bctx.textAlign = 'center';
      bctx.fillText(n.title.length > 14 ? n.title.slice(0,13)+'…' : n.title, n.x, n.y-r-6);
    }
  });
}

function tick() {
  if (!brainOn) return;
  step(); draw();
  requestAnimationFrame(tick);
}

function pos(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function hit(x, y) {
  for (let i = nodes.length-1; i >= 0; i--) {
    const n = nodes[i], r = 5 + Math.min(n.deg*0.9, 8) + 6;
    if ((x-n.x)**2 + (y-n.y)**2 <= r*r) return i;
  }
  return -1;
}

function showCard(i) {
  const e = ENTRIES[i], c = CATS[e.cat];
  card.innerHTML = `<div class="meta"><span class="cat" style="background:${c.color}22;color:${c.color}">${c.name}</span><span class="date">${e.date}</span></div>
    <h3>${esc(e.title)}</h3><div class="body">${esc(e.body)}</div>
    <div class="tags">${e.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="bb" id="bcGo">在列表中查看</button>
      <button class="bb ghost" id="bcClose">关闭</button>
    </div>`;
  card.style.display = 'block';
  document.getElementById('bcGo').onclick = () => {
    card.style.display = 'none'; setView(false);
    activeCat = 'all'; query = ''; qEl.value = '';
    renderChips(); renderList();
    setTimeout(() => {
      const el = listEl.querySelector(`[data-i="${i}"]`);
      if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1800); }
    }, 60);
  };
  document.getElementById('bcClose').onclick = () => card.style.display = 'none';
}

canvas.addEventListener('pointerdown', ev => {
  const p = pos(ev);
  downX = p.x; downY = p.y; moved = 0;
  dragIdx = hit(p.x, p.y);
  if (dragIdx >= 0) { alpha = 0.6; canvas.setPointerCapture(ev.pointerId); }
});
canvas.addEventListener('pointermove', ev => {
  const p = pos(ev);
  if (dragIdx >= 0) {
    moved += Math.abs(p.x-downX) + Math.abs(p.y-downY);
    const n = nodes[dragIdx]; n.x = p.x; n.y = p.y; downX = p.x; downY = p.y;
  } else {
    hovered = hit(p.x, p.y);
    canvas.style.cursor = hovered >= 0 ? 'pointer' : 'default';
  }
});
canvas.addEventListener('pointerup', () => {
  if (dragIdx >= 0 && moved < 8) showCard(dragIdx);
  dragIdx = -1; alpha = 0.5;
});

function setView(brain) {
  brainOn = brain;
  document.body.classList.toggle('brain-on', brain);
  document.getElementById('vList').classList.toggle('active', !brain);
  document.getElementById('vBrain').classList.toggle('active', brain);
  if (brain) {
    card.style.display = 'none';
    resizeBrain();
    if (!graphBuilt) { buildGraph(); graphBuilt = true; }
    alpha = 1;
    requestAnimationFrame(tick);
  }
}
document.getElementById('vList').addEventListener('click', () => setView(false));
document.getElementById('vBrain').addEventListener('click', () => setView(true));
window.addEventListener('resize', () => { if (brainOn) resizeBrain(); });

document.getElementById('stEntries').textContent = ENTRIES.length;
document.getElementById('stCats').textContent = Object.keys(CATS).filter(k => countBy(k) > 0).length;
document.getElementById('stUpdated').textContent = ENTRIES.reduce((m,e) => e.date > m ? e.date : m, '0000-00-00').slice(5).replace('-','/');
renderChips(); renderList();
</script>
</body>
</html>
